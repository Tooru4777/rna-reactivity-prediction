name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Verify ViennaRNA feature dependency
        run: python -c "import RNA; assert RNA.__version__ == '2.7.2', RNA.__version__"

      - name: Compile source
        run: python -m compileall -q src experiments kaggle tests

      - name: Run complete test suite
        run: python -m pytest -q
