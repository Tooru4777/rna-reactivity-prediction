name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pandas numpy matplotlib pyyaml scipy pytest

      - name: Run model architecture tests
        run: python -m pytest tests/test_models.py -v

      - name: Run data pipeline tests
        run: python -m pytest tests/test_data_pipelines.py -v

      - name: Run training smoke tests
        run: python -m pytest tests/test_training.py -v
